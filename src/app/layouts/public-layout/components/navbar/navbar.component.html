<header class="navbar">
  <a class="navbar__brand" [routerLink]="brandLink()">{{ brandTitle() }}</a>
  <nav class="navbar__links">
    @for (link of links(); track $index) {
      <a class="navbar__link" [routerLink]="link.route">{{ link.label }}</a>
    }
  </nav>
  <div class="navbar__actions">
    <a [routerLink]="['/login']">Entrar</a>
    <a [routerLink]="['/signup']">Começar agora</a>
  </div>
</header>
