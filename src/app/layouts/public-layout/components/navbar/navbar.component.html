<header
  class="navbar"
  [attr.data-state]="headerState()"
  [attr.data-over-hero]="overHero()"
  aria-label="Navegação principal"
>
  <div class="navbar__inner mw-container">
    <a class="navbar__brand" routerLink="/" aria-label="Maiawall Cursos — página inicial">
      <img
        class="navbar__logo"
        src="/assets/brand/logo-light.png"
        alt=""
        aria-hidden="true"
        width="36"
        height="36"
      />
      <span class="navbar__wordmark">
        <span class="navbar__maiawall">Maiawall</span>
        <span class="navbar__cursos">Cursos</span>
      </span>
    </a>

    <nav class="navbar__links" aria-label="Menu principal">
      @for (link of links(); track link.label) {
        <a
          class="navbar__link"
          [routerLink]="link.route"
          [fragment]="link.fragment"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="navbar__actions">
      @if (isAuthenticated()) {
        <a class="navbar__profile" routerLink="/perfil" [attr.aria-label]="'Abrir perfil de ' + user()?.name">
          <span class="navbar__profile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.25" />
              <path d="M5.5 20c.7-3.2 2.9-5 6.5-5s5.8 1.8 6.5 5" />
            </svg>
          </span>
          <span>{{ firstName() }}</span>
        </a>
      } @else {
        <a class="navbar__login" routerLink="/login">Entrar</a>
      }
    </div>

    <button
      #toggleButton
      class="navbar__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <div
      #mobileMenu
      id="mobile-menu"
      class="navbar__drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Menu de navegação"
    >
      <nav class="navbar__drawer-links" aria-label="Menu mobile">
        @for (link of links(); track link.label) {
          <a
            class="navbar__drawer-link"
            [routerLink]="link.route"
            [fragment]="link.fragment"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
      </nav>
      <div class="navbar__drawer-actions">
        @if (isAuthenticated()) {
          <a class="navbar__drawer-login navbar__drawer-profile" routerLink="/perfil" (click)="closeMenu()">
            <span class="navbar__profile-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.25" />
                <path d="M5.5 20c.7-3.2 2.9-5 6.5-5s5.8 1.8 6.5 5" />
              </svg>
            </span>
            <span>{{ firstName() }}</span>
          </a>
        } @else {
          <a class="navbar__drawer-login" routerLink="/login" (click)="closeMenu()">Entrar</a>
        }
      </div>
    </div>
  }
</header>
