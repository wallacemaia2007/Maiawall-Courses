<div class="app-layout">
  <app-sidebar [class.is-open]="sidebarOpen()" (dismissed)="closeSidebar()" />
  <div
    class="app-layout__scrim"
    [class.is-visible]="sidebarOpen()"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>
  <div class="app-layout__main">
    <app-topbar (menuToggled)="toggleSidebar()" />
    <main class="app-layout__content">
      <router-outlet />
    </main>
  </div>
</div>
