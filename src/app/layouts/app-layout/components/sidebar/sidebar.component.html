<aside class="sidebar">
  <button
    type="button"
    class="sidebar__close"
    (click)="dismissed.emit()"
    aria-label="Fechar menu de navegação"
  >
    ×
  </button>

  <a class="sidebar__brand" [routerLink]="brandRoute()" (click)="dismissed.emit()">
    <strong>{{ brandTitle() }}</strong>
    <span>{{ brandSubtitle() }}</span>
  </a>

  <nav class="sidebar__nav" aria-label="Navegação do aluno">
    @for (item of navItems(); track item.route) {
      <a
        class="sidebar__item"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: false }"
        [routerLink]="item.route"
        (click)="dismissed.emit()"
      >
        <svg
          class="sidebar__item-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [attr.d]="iconPath(item.icon)" />
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>

  <p class="sidebar__hint">Estude no seu ritmo e acompanhe o progresso.</p>
</aside>
