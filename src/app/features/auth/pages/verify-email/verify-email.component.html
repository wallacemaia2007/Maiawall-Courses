<section class="verify-email-page min-h-[80vh] w-full bg-white px-4 py-12">
  <div class="w-full max-w-md">
    <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
      @if (!completed) {
        <a class="mb-4 inline-flex items-center text-sm text-gray-600 hover:text-gray-900" [routerLink]="['/login']">
          Voltar
        </a>

        <h1 class="mb-1 text-2xl font-semibold tracking-tight text-gray-900">Confirmar e-mail</h1>
        <p class="mb-6 text-sm text-gray-600">
          Informe o codigo de verificacao enviado para sua conta.
        </p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
          <div>
            <label for="verifyToken" class="mb-1 block text-xs font-medium uppercase text-gray-700">
              Codigo
            </label>
            <input
              id="verifyToken"
              formControlName="token"
              type="text"
              autocomplete="one-time-code"
              placeholder="Codigo de verificacao"
              class="w-full rounded-xl border bg-white px-4 py-3 text-sm text-gray-900 transition placeholder:text-gray-400 focus:border-black focus:outline-none focus:ring-1 focus:ring-black"
              [class.border-gray-300]="!token.touched || token.valid"
              [class.border-red-500]="token.touched && token.invalid"
              [attr.aria-invalid]="token.touched && token.invalid"
              [attr.aria-describedby]="token.touched && token.invalid ? 'verify-token-error' : null"
            />
            @if (token.touched && token.invalid) {
              <small id="verify-token-error" role="alert" class="error-animate mt-1 block text-[11px] text-red-600">
                O codigo e obrigatorio.
              </small>
              <div class="error-underline"></div>
            }
          </div>

          <button
            type="submit"
            [disabled]="form.invalid"
            class="w-full rounded-full bg-gradient-to-r from-black to-gray-700 py-3 text-sm font-semibold uppercase tracking-wide text-white shadow-sm transition hover:scale-[1.02] hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-black/50 active:scale-100 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Confirmar
          </button>
        </form>
      } @else {
        <div class="py-4 text-center">
          <div class="mb-4 flex justify-center">
            <div class="flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-2xl font-semibold text-green-700">
              OK
            </div>
          </div>
          <h2 class="mb-2 text-xl font-semibold text-gray-900">E-mail confirmado!</h2>
          <p class="mb-6 text-sm text-gray-600">
            Sua conta foi verificada. Agora voce pode acessar a plataforma.
          </p>
          <a
            [routerLink]="['/login']"
            class="block w-full rounded-full bg-gradient-to-r from-black to-gray-700 py-3 text-sm font-semibold uppercase tracking-wide text-white shadow-sm transition hover:scale-[1.02] hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-black/50 active:scale-100"
          >
            Voltar ao Login
          </a>
        </div>
      }
    </div>
  </div>
</section>
