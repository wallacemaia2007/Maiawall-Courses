<section class="featured-courses">
  <div class="featured-courses__inner mw-container">
    <div appReveal>
      <app-section-head
        eyebrow="Catálogo"
        title="Cursos em destaque"
        subtitle="A Home usa o catálogo compartilhado da plataforma. Comece por Docker, APIs ou Git e avance em cursos curtos, práticos e certificados."
        align="left"
      />
    </div>

    @if (courses$ | async; as courses) {
      <div class="featured-courses__grid">
        @for (course of courses; track course.id; let index = $index) {
          <app-course-card
            [course]="course"
            [index]="index + 1"
            appReveal
            [appRevealDelay]="index * 70"
          />
        }
      </div>
    }

    <div class="featured-courses__more" appReveal>
      <a class="mw-btn mw-btn--outline" routerLink="/cursos">Ver todos os cursos</a>
    </div>
  </div>
</section>
