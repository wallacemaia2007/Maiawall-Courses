<section class="learning-method" id="sobre">
  <div class="learning-method__inner mw-container">
    <div appReveal>
      <app-section-head
        eyebrow="Como explorar o acervo"
        title="Do curso ministrado ao conteúdo para consulta"
        subtitle="Cada curso preserva o contexto, a sequência dos capítulos e os materiais usados durante as aulas."
        align="left"
      />
    </div>

    <ol class="learning-method__steps">
      @for (step of steps(); track step.number; let index = $index) {
        <li class="learning-method__step" appReveal [appRevealDelay]="index * 70">
          <div class="learning-method__step-head">
            <span class="learning-method__number">{{ step.number }}</span>
            <span class="learning-method__line" aria-hidden="true"></span>
          </div>
          <div class="learning-method__step-body">
            <span class="learning-method__step-icon" aria-hidden="true">
              @switch (step.icon) {
                @case ('book') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 6.5C10.4 5 7.6 4 5 4v14c2.6 0 5.4 1 7 2.5 1.6-1.5 4.4-2.5 7-2.5V4c-2.6 0-5.4 1-7 2.5Z" />
                    <path d="M12 6.5V20.5" />
                  </svg>
                }
                @case ('keyboard') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2.5" y="5" width="19" height="12" rx="2" />
                    <path d="M10 9h4M6.5 13h.01M10 13h4M14.5 13h.01M17 9h.01M7 9h.01M6.5 9h.01M17 13h.01" />
                  </svg>
                }
                @case ('chat') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a8 8 0 0 1-8 8H3l2-2.4A8 8 0 1 1 21 12Z" />
                    <path d="M8 10.5h8M8 14h5" />
                  </svg>
                }
                @case ('award') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="9" r="5" />
                    <path d="m8.5 13.5-1.5 7 5-2.5 5 2.5-1.5-7" />
                  </svg>
                }
              }
            </span>
            <h3 class="learning-method__title">{{ step.title }}</h3>
            <p class="learning-method__description">{{ step.description }}</p>
            <p class="learning-method__outcome">{{ step.outcome }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
