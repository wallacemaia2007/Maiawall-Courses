<header class="section-head" [class.section-head--left]="align() === 'left'">
  @if (eyebrow()) {
    <p class="section-head__eyebrow">{{ eyebrow() }}</p>
  }
  <h2 class="section-head__title">{{ title() }}</h2>
  @if (subtitle()) {
    <p class="section-head__subtitle">{{ subtitle() }}</p>
  }
</header>
