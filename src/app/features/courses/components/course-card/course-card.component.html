<article class="course-card" [attr.data-tone]="tone()">
  <a
    class="course-card__link"
    [routerLink]="['/cursos', course().slug]"
    [attr.aria-label]="'Ver curso: ' + course().title"
  >
    <div class="course-card__cover">
      <img
        class="course-card__sponsor-logo"
        src="/assets/ufu.brand.png"
        alt="Minicurso patrocinado pela Universidade Federal de Uberlândia"
      />
    </div>

    <div class="course-card__body">
      <h3 class="course-card__title">{{ course().title }}</h3>

      @if (course().shortDescription) {
        <p class="course-card__description">{{ course().shortDescription }}</p>
      }

      <ul class="course-card__meta">
        <li class="course-card__level">{{ levelLabel() }}</li>
        @if (course().durationMinutes) {
          <li class="course-card__duration">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            {{ course().durationMinutes | duration }}
          </li>
        }
        @if (course().chapterCount) {
          <li class="course-card__chapters">{{ course().chapterCount }} capítulos</li>
        }
      </ul>

      <span class="course-card__action">
        Ver curso
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </div>
  </a>
</article>
